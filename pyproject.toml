[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "go-task-bin>=3.54.0",
    "mypy>=2.4.0",
    "ruff>=0.17.1",
    "ty>=0.0.89",
    "types-pyyaml>=6.0.12.20260906",
]

[project]
authors = [{ name = "Julian Valentin" }]
dependencies = [
    "openrouter>=1.3.65",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
]
description = "Compare OpenRouter models"
name = "orcompare"
readme = "README.md"
requires-python = ">=3.15"
version = "1.0.0"

[project.scripts]
orcompare = "orcompare:main.main"

[tool.mypy]
files = ["src"]

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
ignore = [
    "docstring-missing-exception",
    "docstring-missing-returns",
    "incorrect-blank-line-before-class",
    "missing-trailing-comma",
    "multi-line-summary-second-line",
    "too-many-arguments",
]
select = ["ALL"]

[tool.ty]

[tool.uv]
override-dependencies = [
    # OpenRouter has a pin on Pydantic from above. That pin has been added in a commit that changes 2272 files with over
    # 50k changed lines (https://github.com/OpenRouterTeam/python-sdk/commit/babeffc9aa), so I'd say that pin is AI
    # slop. The pin prevents using Python 3.15 as the latest compatible Pydantic version has a pin on a version of PyO3
    # from above which is incompatible with Python 3.15.
    { package = { name = "openrouter" }, dependencies = [
        "pydantic>=2.14.1",
    ] },
]
