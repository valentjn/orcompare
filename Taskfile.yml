version: "3"

env:
  FORCE_COLOR: "1"

output: prefixed

tasks:
  build:
    cmd: uv build

  check:
    cmds:
      - task: check:uv
      - task: check:rest

  check:rest:
    internal: true
    deps:
      - check:mypy
      - check:ruff-format
      - check:ruff-lint
      - check:ty

  default:
    cmds:
      - task: prepare
      - task: check

  prepare:
    cmd: uv sync

  run:
    cmd: uv run orcompare {{.CLI_ARGS}}

  run-save:
    cmd: uv run orcompare --save-as-preset favorite {{.CLI_ARGS}}

  check:mypy:
    cmd: uv run mypy

  check:ruff-format:
    cmd: uv run ruff format --check

  check:ruff-lint:
    cmd: uv run ruff check

  check:ty:
    cmd: uv run ty check --color=always

  check:uv:
    cmd: uv lock --check
